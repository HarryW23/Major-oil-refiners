[hidden]{display:none!important}
/* 版面：頂部選廠 → 一行廠況 → 從左到右的工藝流程圖（原料→蒸餾→二次加工→化工→材料），圖在自己的橫向捲動容器內 */
:root{

  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161c; --surface:#19222b; --ink:#e6edf3; --muted:#94a3b3; --line:#2e3b48;
  --edge:#566575; --in:#62aef0; --out:#f0965a;
  --feed:#cfd9e3; --feed-ink:#10161c;
  --unit:#19222b; --unit-bd:#cfd9e3;
  --stream:#232f3b; --stream-bd:#566575;
  --chem:#15332e; --chem-bd:#4bb7a2;
  --prod:#3a2c15; --prod-bd:#d9a050;
  --fuel:#232a47; --fuel-bd:#8c98dc;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#19222b; --ink:#e6edf3; --muted:#94a3b3; --line:#2e3b48;
  --edge:#566575; --in:#62aef0; --out:#f0965a;
  --feed:#cfd9e3; --feed-ink:#10161c;
  --unit:#19222b; --unit-bd:#cfd9e3;
  --stream:#232f3b; --stream-bd:#566575;
  --chem:#15332e; --chem-bd:#4bb7a2;
  --prod:#3a2c15; --prod-bd:#d9a050;
  --fuel:#232a47; --fuel-bd:#8c98dc;
  color-scheme:dark }

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
.lede{margin:2px 0 0;color:var(--muted);max-width:62em}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:7px 14px;cursor:pointer}
.tabs button small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.tabs button[aria-selected="true"]{background:var(--feed);color:var(--feed-ink);border-color:var(--feed)}
.tabs button[aria-selected="true"] small{color:inherit;opacity:.75}
.tabs button:focus-visible,.node:focus-visible{outline:2px solid var(--in);outline-offset:2px}

.facts{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.facts h2{font-size:17px;margin:0;font-weight:700}
.facts h2 span{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px}
.kpi{min-width:0}
.kpi dt{font-size:11px;color:var(--muted);letter-spacing:.08em}
.kpi dd{margin:0;font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi dd i{font-style:normal;font-family:var(--font);font-size:11px;color:var(--muted);margin-left:3px}
.kpis,.meta{margin:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:12px;border-radius:3px;border:1.5px solid}
.sw.feed{background:var(--feed);border-color:var(--feed)} .sw.unit{background:var(--unit);border-color:var(--unit-bd)}
.sw.stream{background:var(--stream);border-color:var(--stream-bd)} .sw.chem{background:var(--chem);border-color:var(--chem-bd)}
.sw.prod{background:var(--prod);border-color:var(--prod-bd)} .sw.fuel{background:var(--fuel);border-color:var(--fuel-bd)}
.sw.ghost{background:transparent;border:1.5px dashed var(--edge)}
.ln{width:22px;height:0;border-top:2px solid var(--edge)} .ln.rec{border-top-style:dashed}

.wrap{position:relative}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
svg{display:block;width:100%;min-width:1560px;height:auto;font-family:var(--font)}
.colhead{font-size:11px;fill:var(--muted);letter-spacing:.12em}
.colrule{stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4;marker-end:url(#arr);transition:opacity .12s}
.edge.rec{stroke-dasharray:5 4}
.edge.in{stroke:var(--in);stroke-width:2.2;marker-end:url(#arrIn)}
.edge.out{stroke:var(--out);stroke-width:2.2;marker-end:url(#arrOut)}
#arr path{fill:var(--edge)} #arrIn path{fill:var(--in)} #arrOut path{fill:var(--out)}
.node{cursor:pointer;transition:opacity .12s}
.node rect{stroke-width:1.5}
.node .nm{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.node .sb{font-size:10px;font-family:var(--mono);text-anchor:middle;fill:var(--muted)}
.node.feed rect{fill:var(--feed);stroke:var(--feed)} .node.feed .nm{fill:var(--feed-ink)} .node.feed .sb{fill:var(--feed-ink);opacity:.8}
.node.unit rect{fill:var(--unit);stroke:var(--unit-bd)}
.node.stream rect{fill:var(--stream);stroke:var(--stream-bd)}
.node.chem rect{fill:var(--chem);stroke:var(--chem-bd)}
.node.prod rect{fill:var(--prod);stroke:var(--prod-bd)}
.node.fuel rect{fill:var(--fuel);stroke:var(--fuel-bd)}
.node.ghost rect{fill:var(--surface);stroke:var(--edge);stroke-dasharray:4 3}
.node.ghost .nm{fill:var(--muted);font-weight:500}
svg.focus .node:not(.on){opacity:.3}
svg.focus .edge:not(.in):not(.out){opacity:.12}
.node.sel rect{stroke-width:2.6}

.tip{position:absolute;z-index:5;width:300px;max-width:calc(100% - 16px);background:var(--surface);color:var(--ink);
  border:1px solid var(--unit-bd);border-radius:6px;padding:12px 14px;font-size:13px;pointer-events:auto;
  box-shadow:0 6px 22px rgba(10,20,30,.22);display:flex;flex-direction:column;gap:7px}
.tip h3{margin:0;font-size:15px;font-weight:700}
.tip h3 span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
.tip .yl{font-size:12.5px;border-left:3px solid var(--in);padding-left:8px}
.tip .here{font-size:12.5px;border-left:3px solid var(--out);padding-left:8px}
.tip p{margin:0}
.tip b.k{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:500}
.tip .io{font-size:12px;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.tip .io .i{color:var(--in)} .tip .io .o{color:var(--out)}
.foot{font-size:12px;color:var(--muted);max-width:75em}
@media (prefers-reduced-motion:reduce){.edge,.node{transition:none}}
.by{font-size:12px;font-weight:300;color:var(--muted);opacity:.75;margin-left:10px;letter-spacing:.03em;vertical-align:middle}

/* 語言切換 */
html[lang="zh-Hans-CN"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
html[lang="en-US"]{--font:"Inter","Noto Sans TC",system-ui,sans-serif}
.langrow{max-width:1720px;margin:0 auto 10px;display:flex;justify-content:flex-end}
.langsw{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.langsw button{font-family:var(--font);font-size:12px;border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.langsw button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
</style>

<div class="page">
  <header>

    <p class="lede">從原油到聚酯、塑膠的加工路線。滑鼠停在任一方塊上（手機點一下），可看這一步做什麼、產物用在哪裡，以及它的進料和去向。</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="facts" id="facts" aria-live="polite"></section>

  <div class="legend">
    <span><i class="sw feed"></i>原料</span>
    <span><i class="sw unit"></i>加工裝置</span>
    <span><i class="sw stream"></i>中間餾分</span>
    <span><i class="sw chem"></i>基礎化工原料</span>
    <span><i class="sw prod"></i>化工產品</span>
    <span><i class="sw fuel"></i>成品油及副產</span>
    <span><i class="sw ghost"></i>本廠未配置</span>
    <span><i class="ln"></i>主流程</span>
    <span><i class="ln rec"></i>裝置間回煉</span>
    <span>方塊內：規模（萬噸/年）· 出率（產量÷原油加工量）</span>
  </div>

  <div class="wrap" id="wrap">

  </div>

  <p class="foot">規模數字取自環評批復、公司公告和產業報導，個別裝置後來有擴能或方案調整，標「待核實」的項目未找到一致來源。圖中只畫主幹物流，氫氣管網、燃料氣、公用工程等省略；同一欄內的虛線表示裝置之間的回煉料。出率＝設計產能÷原油加工能力，屬於設計口徑，實際運轉會隨原油、負荷和檢修變化；加工裝置的百分比是處理量佔原油加工量的比例，不是出率。查不到可靠數字的方塊不顯示出率。<br>By Harry汪</p>
</div>

  <p class="foot">Capacities come from environmental approvals, company filings and industry reports; some units were later expanded or redesigned, and items marked “to be verified” lack a consistent source. Only the main streams are drawn; the hydrogen network, fuel gas and utilities are left out, and dashed lines within a column are recycle streams between units. Yield = design capacity ÷ crude capacity, a design-basis figure; actual operation varies with crude slate, run rates and turnarounds. For process units the percentage is throughput as a share of crude runs, not a yield. Boxes without a reliable figure show no yield.<br>By Harry汪</p>

const fmtQ=q=>String(Math.round(q*10)/10);
function yinfo(p,id){

function boxSub(p,id){
  const info=p.n[id];let s=Array.isArray(info)?info[0]:(info||'');const y=yinfo(p,id);

function yieldLine(p,id){
  const y=yinfo(p,id);if(!y)return '';

const NW=128,NH=40,CW=186,RH=54,PADX=18,TOP=40,GAP=CW-NW,NS='http://www.w3.org/2000/svg';

const W=PADX*2+CW*COLS.length-GAP,H=TOP+RH*14+10;
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const X=c=>PADX+c*CW, Y=r=>TOP+r*RH+RH/2;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
let cur=null,nodesEl={},edgesEl=[],pinned=null;

function rounded(pts){
  const p=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]);
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1],b=p[i],c=p[i+1];
    const l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const r=Math.min(7,l1/2,l2/2);
    const p1=[b[0]+(a[0]-b[0])/l1*r,b[1]+(a[1]-b[1])/l1*r],p2=[b[0]+(c[0]-b[0])/l2*r,b[1]+(c[1]-b[1])/l2*r];
    d+=`L${p1[0]},${p1[1]}Q${b[0]},${b[1]} ${p2[0]},${p2[1]}`;
  }
  const z=p[p.length-1];return d+`L${z[0]},${z[1]}`;
}

function draw(plant){
  cur=plant;pinned=null;hide();
  svg.innerHTML='';nodesEl={};edgesEl=[];
  const defs=el('defs',{},svg);
  for(const id of ['arr','arrIn','arrOut']){const m=el('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,orient:'auto',markerUnits:'userSpaceOnUse'},defs);el('path',{d:'M0,0.5L8,4L0,7.5z'},m)}
  COLS.forEach((t,c)=>{el('text',{x:X(c)+NW/2,y:18,class:'colhead','text-anchor':'middle'},svg).textContent=t});
  el('line',{x1:PADX,x2:W-PADX,y1:28,y2:28,class:'colrule'},svg);

  // 本廠要畫的節點（含未配置的虛框）
  const shown={},occ={};
  for(const id in LIB){const L=LIB[id],has=id in plant.n; if(has||L.g||['fcc','coker','pdh','mto'].includes(id)){shown[id]=has;occ[L.c+','+L.r]=1}}
  const edges=EDGES.filter(([a,b])=>shown[a]&&shown[b]);

  // 垂直走線分道：同一來源（或同一去向）共用一條幹線
  const lanes=COLS.map(()=>new Map());
  const lane=(c,key)=>{const m=lanes[c];if(!m.has(key))m.set(key,m.size);return key};
  const plan=edges.map(([a,b,lab])=>{
    const A=LIB[a],B=LIB[b];let mode;
    if(B.c===A.c){mode='rec';lane(A.c,'s'+a)}
    else if(B.c===A.c+1){mode='adj';lane(A.c,'s'+a)}
    else{
      const free=r=>{for(let c=A.c+1;c<B.c;c++)if(occ[c+','+r])return false;return true};
      if(free(A.r)){mode='srow';lane(B.c-1,'t'+b)}
      else if(free(B.r)){mode='trow';lane(A.c,'s'+a)}
      else{mode='chan';lane(A.c,'s'+a);lane(B.c-1,'t'+b)}
    }
    return{a,b,lab,mode};
  });
  const lx=(c,key)=>{const m=lanes[c],n=m.size,step=Math.min(9,(GAP-22)/Math.max(1,n-1));return X(c)+NW+11+m.get(key)*step};

  const gE=el('g',{},svg),gN=el('g',{},svg);
  for(const p of plan){
    const A=LIB[p.a],B=LIB[p.b],x0=X(A.c)+NW,y0=Y(A.r),x3=X(B.c),y3=Y(B.r);let pts;
    if(p.mode==='rec'){const x=lx(A.c,'s'+p.a),yt=y3+(y3<y0?11:-11);pts=[[x0,y0],[x,y0],[x,yt],[x0+1,yt]]}
    else if(p.mode==='adj'||p.mode==='trow'){const x=lx(A.c,'s'+p.a);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else if(p.mode==='srow'){const x=lx(B.c-1,'t'+p.b);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else{const x1=lx(A.c,'s'+p.a),x2=lx(B.c-1,'t'+p.b);
      const mid=(A.r+B.r)/2,yc=TOP+(Math.round(mid+(A.r<B.r?.01:-.01)-.5)+1)*RH;
      pts=[[x0,y0],[x1,y0],[x1,yc],[x2,yc],[x2,y3],[x3,y3]]}
    const e=el('path',{d:rounded(pts),class:'edge'+(p.mode==='rec'&&A.c===3?' rec':'')},gE);
    edgesEl.push({e,a:p.a,b:p.b,lab:p.lab});
  }
  for(const id in shown){
    const L=LIB[id],has=shown[id],sub=has?boxSub(plant,id):'未配置';
    const name=(plant.label&&plant.label[id])||L.n;
    const g=el('g',{class:'node '+(has?L.t:'ghost'),tabindex:0,'data-id':id,role:'button','aria-label':name,transform:`translate(${X(L.c)},${Y(L.r)-NH/2})`},gN);
    el('rect',{width:NW,height:NH,rx:L.t==='unit'||!has?3:14},g);
    el('text',{x:NW/2,y:sub?17:25,class:'nm'},g).textContent=name;
    if(sub)el('text',{x:NW/2,y:32,class:'sb'},g).textContent=sub;
    nodesEl[id]=g;
    g.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT);if(pinned)return;if(tip.hidden)show(id);else showT=setTimeout(()=>show(id),150)});
    g.addEventListener('mouseleave',()=>{clearTimeout(showT);if(!pinned)hideSoon()});
    g.addEventListener('focus',()=>{if(!pinned)show(id)});
    g.addEventListener('blur',()=>{if(!pinned)hide()});
    g.addEventListener('click',ev=>{ev.stopPropagation();if(pinned===id){pinned=null;hide()}else{pinned=id;show(id)}});
    g.addEventListener('keydown',ev=>{if(ev.key==='Escape'){pinned=null;hide()}});
  }
}

const nm=id=>(cur.label&&cur.label[id])||LIB[id].n;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(id){
  const L=LIB[id],has=id in cur.n,info=cur.n[id],sub=has&&Array.isArray(info)?info[0]:(info||''),note=has&&Array.isArray(info)?info[1]:'';
  svg.classList.add('focus');
  for(const k in nodesEl){nodesEl[k].classList.remove('on','sel')}
  nodesEl[id].classList.add('on','sel');
  const ins=[],outs=[];
  for(const x of edgesEl){
    x.e.classList.toggle('in',x.b===id);x.e.classList.toggle('out',x.a===id);
    if(x.b===id){nodesEl[x.a].classList.add('on');ins.push(`${nm(x.a)}（${x.lab}）`)}
    if(x.a===id){nodesEl[x.b].classList.add('on');outs.push(`${nm(x.b)}（${x.lab}）`)}
  }
  const isUnit=L.t==='unit';
  let here='';
  if(!has)here=`<div class="here">${esc(cur.name)}沒有配置這套裝置。</div>`;
  else if(sub||note){const cap=sub?(/^[\d×＋+ .]+$/.test(sub)?sub+' 萬噸/年':sub):'';here=`<div class="here"><b>${esc(cur.name)}：</b>${esc([cap,note].filter(Boolean).join('。'))}</div>`}
  const yl=has?yieldLine(cur,id):'';
  tip.innerHTML=`<h3>${esc(nm(id))}<span>${esc(L.e)}</span></h3>${here}${yl?`<div class="yl">${esc(yl)}</div>`:''}
    <p><b class="k">${isUnit?'這一步做什麼':'是什麼'}</b>${esc(L.d)}</p>
    <p><b class="k">${isUnit?'產物去向和用途':'用處'}</b>${esc(L.u)}</p>
    ${ins.length||outs.length?`<div class="io">${ins.length?`<span class="i">← 來自：${esc(ins.join('、'))}</span>`:''}${outs.length?`<span class="o">→ 去往：${esc(outs.join('、'))}</span>`:''}</div>`:''}`;
  tip.hidden=false;
  const nr=nodesEl[id].getBoundingClientRect(),wr=wrap.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=nr.right-wr.left+12;if(left+tw>wr.width-4)left=nr.left-wr.left-tw-12;
  if(left<4)left=Math.max(4,Math.min(wr.width-tw-4,nr.left-wr.left));
  let top=nr.top-wr.top-10;
  if(left<nr.right-wr.left&&left+tw>nr.left-wr.left)top=nr.bottom-wr.top+10; // 放不到左右時改放下方
  top=Math.max(4,Math.min(top,Math.max(4,wr.height-th-4)));
  if(!(left<nr.right-wr.left&&left+tw>nr.left-wr.left))top=Math.max(4,Math.min(top,window.innerHeight-wr.top-th-8)); // 放在方塊旁邊時，盡量留在視窗內
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hide(){tip.hidden=true;svg.classList.remove('focus');for(const k in nodesEl)nodesEl[k].classList.remove('on','sel');for(const x of edgesEl)x.e.classList.remove('in','out')}
document.addEventListener('click',()=>{if(pinned){pinned=null;hide()}});
/* 從方塊移到詳情框時保留詳情框，離開詳情框後才隱藏 */
let hideT=null,showT=null;
function hideSoon(){clearTimeout(hideT);hideT=setTimeout(()=>{if(!pinned)hide()},200)}
tip.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT)});

tip.addEventListener('click',ev=>ev.stopPropagation());

const fmtQ=q=>String(Math.round(q*10)/10);
function yinfo(p,id){
  const e=YIELD[p.id]&&YIELD[p.id].q[id];if(!e)return null;
  const [q,note,no]=e;return{q,note:note||'',no:!!no,feed:FEED.has(id),pct:q!=null&&!no?q/(+p.cap)*100:null};
}
function boxSub(p,id){
  const info=p.n[id];let s=Array.isArray(info)?info[0]:(info||'');const y=yinfo(p,id);
  if(!y)return s;if(!s&&y.q!=null)s=fmtQ(y.q);
  return y.pct!=null?(s?s+' · ':'')+y.pct.toFixed(1)+'%':s;
}
function yieldLine(p,id){
  const y=yinfo(p,id);if(!y)return '';
  let t;
  if(y.q==null)t='';
  else if(y.no)t=`${fmtQ(y.q)} 万吨/年，不计出率。`;
  else if(y.feed)t=`处理量 ${fmtQ(y.q)} ÷ 原油 ${p.cap} ＝ ${y.pct.toFixed(1)}%（装置规模占原油加工量）。`;
  else t=`出率 ${y.pct.toFixed(1)}%＝${fmtQ(y.q)} ÷ ${p.cap} 万吨原油（设计产能口径）。`;
  return [t,y.no?y.note.replace('不计出率。',''):y.note].filter(Boolean).join(' ');
}

const NW=128,NH=40,CW=186,RH=54,PADX=18,TOP=40,GAP=CW-NW,NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg'),tip=document.getElementById('tip'),wrap=document.getElementById('wrap');
const W=PADX*2+CW*COLS.length-GAP,H=TOP+RH*14+10;
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const X=c=>PADX+c*CW, Y=r=>TOP+r*RH+RH/2;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
let cur=null,nodesEl={},edgesEl=[],pinned=null;

function rounded(pts){
  const p=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]);
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1],b=p[i],c=p[i+1];
    const l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const r=Math.min(7,l1/2,l2/2);
    const p1=[b[0]+(a[0]-b[0])/l1*r,b[1]+(a[1]-b[1])/l1*r],p2=[b[0]+(c[0]-b[0])/l2*r,b[1]+(c[1]-b[1])/l2*r];
    d+=`L${p1[0]},${p1[1]}Q${b[0]},${b[1]} ${p2[0]},${p2[1]}`;
  }
  const z=p[p.length-1];return d+`L${z[0]},${z[1]}`;
}

function draw(plant){
  cur=plant;pinned=null;hide();
  svg.innerHTML='';nodesEl={};edgesEl=[];
  const defs=el('defs',{},svg);
  for(const id of ['arr','arrIn','arrOut']){const m=el('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,orient:'auto',markerUnits:'userSpaceOnUse'},defs);el('path',{d:'M0,0.5L8,4L0,7.5z'},m)}
  COLS.forEach((t,c)=>{el('text',{x:X(c)+NW/2,y:18,class:'colhead','text-anchor':'middle'},svg).textContent=t});
  el('line',{x1:PADX,x2:W-PADX,y1:28,y2:28,class:'colrule'},svg);

  // 本厂要画的节点（含未配置的虚框）
  const shown={},occ={};
  for(const id in LIB){const L=LIB[id],has=id in plant.n; if(has||L.g||['fcc','coker','pdh','mto'].includes(id)){shown[id]=has;occ[L.c+','+L.r]=1}}
  const edges=EDGES.filter(([a,b])=>shown[a]&&shown[b]);

  // 垂直走线分道：同一来源（或同一去向）共用一条干线
  const lanes=COLS.map(()=>new Map());
  const lane=(c,key)=>{const m=lanes[c];if(!m.has(key))m.set(key,m.size);return key};
  const plan=edges.map(([a,b,lab])=>{
    const A=LIB[a],B=LIB[b];let mode;
    if(B.c===A.c){mode='rec';lane(A.c,'s'+a)}
    else if(B.c===A.c+1){mode='adj';lane(A.c,'s'+a)}
    else{
      const free=r=>{for(let c=A.c+1;c<B.c;c++)if(occ[c+','+r])return false;return true};
      if(free(A.r)){mode='srow';lane(B.c-1,'t'+b)}
      else if(free(B.r)){mode='trow';lane(A.c,'s'+a)}
      else{mode='chan';lane(A.c,'s'+a);lane(B.c-1,'t'+b)}
    }
    return{a,b,lab,mode};
  });
  const lx=(c,key)=>{const m=lanes[c],n=m.size,step=Math.min(9,(GAP-22)/Math.max(1,n-1));return X(c)+NW+11+m.get(key)*step};

  const gE=el('g',{},svg),gN=el('g',{},svg);
  for(const p of plan){
    const A=LIB[p.a],B=LIB[p.b],x0=X(A.c)+NW,y0=Y(A.r),x3=X(B.c),y3=Y(B.r);let pts;
    if(p.mode==='rec'){const x=lx(A.c,'s'+p.a),yt=y3+(y3<y0?11:-11);pts=[[x0,y0],[x,y0],[x,yt],[x0+1,yt]]}
    else if(p.mode==='adj'||p.mode==='trow'){const x=lx(A.c,'s'+p.a);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else if(p.mode==='srow'){const x=lx(B.c-1,'t'+p.b);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else{const x1=lx(A.c,'s'+p.a),x2=lx(B.c-1,'t'+p.b);
      const mid=(A.r+B.r)/2,yc=TOP+(Math.round(mid+(A.r<B.r?.01:-.01)-.5)+1)*RH;
      pts=[[x0,y0],[x1,y0],[x1,yc],[x2,yc],[x2,y3],[x3,y3]]}
    const e=el('path',{d:rounded(pts),class:'edge'+(p.mode==='rec'&&A.c===3?' rec':'')},gE);
    edgesEl.push({e,a:p.a,b:p.b,lab:p.lab});
  }
  for(const id in shown){
    const L=LIB[id],has=shown[id],sub=has?boxSub(plant,id):'未配置';
    const name=(plant.label&&plant.label[id])||L.n;
    const g=el('g',{class:'node '+(has?L.t:'ghost'),tabindex:0,'data-id':id,role:'button','aria-label':name,transform:`translate(${X(L.c)},${Y(L.r)-NH/2})`},gN);
    el('rect',{width:NW,height:NH,rx:L.t==='unit'||!has?3:14},g);
    el('text',{x:NW/2,y:sub?17:25,class:'nm'},g).textContent=name;
    if(sub)el('text',{x:NW/2,y:32,class:'sb'},g).textContent=sub;
    nodesEl[id]=g;
    g.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT);if(pinned)return;if(tip.hidden)show(id);else showT=setTimeout(()=>show(id),150)});
    g.addEventListener('mouseleave',()=>{clearTimeout(showT);if(!pinned)hideSoon()});
    g.addEventListener('focus',()=>{if(!pinned)show(id)});
    g.addEventListener('blur',()=>{if(!pinned)hide()});
    g.addEventListener('click',ev=>{ev.stopPropagation();if(pinned===id){pinned=null;hide()}else{pinned=id;show(id)}});
    g.addEventListener('keydown',ev=>{if(ev.key==='Escape'){pinned=null;hide()}});
  }
}

const nm=id=>(cur.label&&cur.label[id])||LIB[id].n;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(id){
  const L=LIB[id],has=id in cur.n,info=cur.n[id],sub=has&&Array.isArray(info)?info[0]:(info||''),note=has&&Array.isArray(info)?info[1]:'';
  svg.classList.add('focus');
  for(const k in nodesEl){nodesEl[k].classList.remove('on','sel')}
  nodesEl[id].classList.add('on','sel');
  const ins=[],outs=[];
  for(const x of edgesEl){
    x.e.classList.toggle('in',x.b===id);x.e.classList.toggle('out',x.a===id);
    if(x.b===id){nodesEl[x.a].classList.add('on');ins.push(`${nm(x.a)}（${x.lab}）`)}
    if(x.a===id){nodesEl[x.b].classList.add('on');outs.push(`${nm(x.b)}（${x.lab}）`)}
  }
  const isUnit=L.t==='unit';
  let here='';
  if(!has)here=`<div class="here">${esc(cur.name)}没有配置这套装置。</div>`;
  else if(sub||note){const cap=sub?(/^[\d×＋+ .]+$/.test(sub)?sub+' 万吨/年':sub):'';here=`<div class="here"><b>${esc(cur.name)}：</b>${esc([cap,note].filter(Boolean).join('。'))}</div>`}
  const yl=has?yieldLine(cur,id):'';
  tip.innerHTML=`<h3>${esc(nm(id))}<span>${esc(L.e)}</span></h3>${here}${yl?`<div class="yl">${esc(yl)}</div>`:''}
    <p><b class="k">${isUnit?'这一步做什么':'是什么'}</b>${esc(L.d)}</p>
    <p><b class="k">${isUnit?'产物去向和用途':'用处'}</b>${esc(L.u)}</p>
    ${ins.length||outs.length?`<div class="io">${ins.length?`<span class="i">← 来自：${esc(ins.join('、'))}</span>`:''}${outs.length?`<span class="o">→ 去往：${esc(outs.join('、'))}</span>`:''}</div>`:''}`;
  tip.hidden=false;
  const nr=nodesEl[id].getBoundingClientRect(),wr=wrap.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=nr.right-wr.left+12;if(left+tw>wr.width-4)left=nr.left-wr.left-tw-12;
  if(left<4)left=Math.max(4,Math.min(wr.width-tw-4,nr.left-wr.left));
  let top=nr.top-wr.top-10;
  if(left<nr.right-wr.left&&left+tw>nr.left-wr.left)top=nr.bottom-wr.top+10; // 放不到左右时改放下方
  top=Math.max(4,Math.min(top,Math.max(4,wr.height-th-4)));
  if(!(left<nr.right-wr.left&&left+tw>nr.left-wr.left))top=Math.max(4,Math.min(top,window.innerHeight-wr.top-th-8)); // 放在方块旁边时，尽量留在窗口内
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hide(){tip.hidden=true;svg.classList.remove('focus');for(const k in nodesEl)nodesEl[k].classList.remove('on','sel');for(const x of edgesEl)x.e.classList.remove('in','out')}
document.addEventListener('click',()=>{if(pinned){pinned=null;hide()}});
/* 从方块移到详情框时保留详情框，离开详情框后才隐藏 */
let hideT=null,showT=null;
function hideSoon(){clearTimeout(hideT);hideT=setTimeout(()=>{if(!pinned)hide()},200)}
tip.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT)});
tip.addEventListener('mouseleave',()=>{if(!pinned)hideSoon()});
tip.addEventListener('click',ev=>ev.stopPropagation());
document.getElementById('scroll').addEventListener('scroll',()=>{if(pinned)show(pinned)});

/* ---------- 选厂 ---------- */
const tabs=document.getElementById('tabs'),facts=document.getElementById('facts');
function select(id){
  const p=PLANTS.find(x=>x.id===id)||PLANTS[0];
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===p.id));
  facts.innerHTML=`<h2>${esc(p.name)}<span>${esc(p.full)}</span></h2>
    <dl class="kpis">${p.kpi.map(k=>`<div class="kpi"><dt>${esc(k[0])}</dt><dd>${esc(k[1])}<i>万吨/年</i></dd></div>`).join('')}<div class="kpi"><dt>成品油收率</dt><dd>${esc(YIELD[p.id].oil.t)}</dd></div></dl>
    <dl class="meta">${p.meta.map(m=>`<dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd>`).join('')}<dt>成品油</dt><dd>${esc(YIELD[p.id].oil.note)}</dd></dl>`;
  draw(p);
}
PLANTS.forEach(p=>{const b=document.createElement('button');b.type='button';b.id='tab-'+p.id;b.dataset.id=p.id;b.setAttribute('role','tab');
  b.innerHTML=`${esc(p.tab)}<small>${p.cap}</small>`;b.addEventListener('click',()=>{location.hash=p.id;select(p.id)});tabs.appendChild(b)});
window.addEventListener('hashchange',()=>select(location.hash.slice(1)));
select(location.hash.slice(1));

};

const fmtQ=q=>String(Math.round(q*10)/10);
function yinfo(p,id){
  const e=YIELD[p.id]&&YIELD[p.id].q[id];if(!e)return null;
  const [q,note,no]=e;return{q,note:note||'',no:!!no,feed:FEED.has(id),pct:q!=null&&!no?q/(+p.cap)*100:null};
}
function boxSub(p,id){
  const info=p.n[id];let s=Array.isArray(info)?info[0]:(info||'');const y=yinfo(p,id);
  if(!y)return s;if(!s&&y.q!=null)s=fmtQ(y.q);
  return y.pct!=null?(s?s+' · ':'')+y.pct.toFixed(1)+'%':s;
}
function yieldLine(p,id){
  const y=yinfo(p,id);if(!y)return '';
  let t;
  if(y.q==null)t='';
  else if(y.no)t=`${fmtQ(y.q)} ×10⁴ t/yr. No yield calculated.`;
  else if(y.feed)t=`Throughput ${fmtQ(y.q)} ÷ crude ${p.cap} = ${y.pct.toFixed(1)}% (unit capacity as a share of crude runs).`;
  else t=`Yield ${y.pct.toFixed(1)}% = ${fmtQ(y.q)} ÷ ${p.cap} ×10⁴ t crude (design-capacity basis).`;
  return [t,y.no?y.note.replace('No yield calculated.',''):y.note].filter(Boolean).join(' ');
}

    const l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const r=Math.min(7,l1/2,l2/2);
    const p1=[b[0]+(a[0]-b[0])/l1*r,b[1]+(a[1]-b[1])/l1*r],p2=[b[0]+(c[0]-b[0])/l2*r,b[1]+(c[1]-b[1])/l2*r];
    d+=`L${p1[0]},${p1[1]}Q${b[0]},${b[1]} ${p2[0]},${p2[1]}`;
  }
  const z=p[p.length-1];return d+`L${z[0]},${z[1]}`;
}

function draw(plant){
  cur=plant;pinned=null;hide();
  svg.innerHTML='';nodesEl={};edgesEl=[];
  const defs=el('defs',{},svg);
  for(const id of ['arr','arrIn','arrOut']){const m=el('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,orient:'auto',markerUnits:'userSpaceOnUse'},defs);el('path',{d:'M0,0.5L8,4L0,7.5z'},m)}
  COLS.forEach((t,c)=>{el('text',{x:X(c)+NW/2,y:18,class:'colhead','text-anchor':'middle'},svg).textContent=t});
  el('line',{x1:PADX,x2:W-PADX,y1:28,y2:28,class:'colrule'},svg);

  // 本廠要畫的節點 (含未配置的虛框)
  const shown={},occ={};
  for(const id in LIB){const L=LIB[id],has=id in plant.n; if(has||L.g||['fcc','coker','pdh','mto'].includes(id)){shown[id]=has;occ[L.c+','+L.r]=1}}
  const edges=EDGES.filter(([a,b])=>shown[a]&&shown[b]);

  // 垂直走線分道: 同一來源 (或同一去向)共用一條幹線
  const lanes=COLS.map(()=>new Map());
  const lane=(c,key)=>{const m=lanes[c];if(!m.has(key))m.set(key,m.size);return key};
  const plan=edges.map(([a,b,lab])=>{
    const A=LIB[a],B=LIB[b];let mode;
    if(B.c===A.c){mode='rec';lane(A.c,'s'+a)}
    else if(B.c===A.c+1){mode='adj';lane(A.c,'s'+a)}
    else{
      const free=r=>{for(let c=A.c+1;c<B.c;c++)if(occ[c+','+r])return false;return true};
      if(free(A.r)){mode='srow';lane(B.c-1,'t'+b)}
      else if(free(B.r)){mode='trow';lane(A.c,'s'+a)}
      else{mode='chan';lane(A.c,'s'+a);lane(B.c-1,'t'+b)}
    }
    return{a,b,lab,mode};
  });
  const lx=(c,key)=>{const m=lanes[c],n=m.size,step=Math.min(9,(GAP-22)/Math.max(1,n-1));return X(c)+NW+11+m.get(key)*step};

  const gE=el('g',{},svg),gN=el('g',{},svg);
  for(const p of plan){
    const A=LIB[p.a],B=LIB[p.b],x0=X(A.c)+NW,y0=Y(A.r),x3=X(B.c),y3=Y(B.r);let pts;
    if(p.mode==='rec'){const x=lx(A.c,'s'+p.a),yt=y3+(y3<y0?11:-11);pts=[[x0,y0],[x,y0],[x,yt],[x0+1,yt]]}
    else if(p.mode==='adj'||p.mode==='trow'){const x=lx(A.c,'s'+p.a);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else if(p.mode==='srow'){const x=lx(B.c-1,'t'+p.b);pts=[[x0,y0],[x,y0],[x,y3],[x3,y3]]}
    else{const x1=lx(A.c,'s'+p.a),x2=lx(B.c-1,'t'+p.b);
      const mid=(A.r+B.r)/2,yc=TOP+(Math.round(mid+(A.r<B.r?.01:-.01)-.5)+1)*RH;
      pts=[[x0,y0],[x1,y0],[x1,yc],[x2,yc],[x2,y3],[x3,y3]]}
    const e=el('path',{d:rounded(pts),class:'edge'+(p.mode==='rec'&&A.c===3?' rec':'')},gE);
    edgesEl.push({e,a:p.a,b:p.b,lab:p.lab});
  }
  for(const id in shown){
    const L=LIB[id],has=shown[id],sub=has?boxSub(plant,id):'not built';
    const name=(plant.label&&plant.label[id])||L.n;
    const g=el('g',{class:'node '+(has?L.t:'ghost'),tabindex:0,'data-id':id,role:'button','aria-label':name,transform:`translate(${X(L.c)},${Y(L.r)-NH/2})`},gN);
    el('rect',{width:NW,height:NH,rx:L.t==='unit'||!has?3:14},g);
    el('text',{x:NW/2,y:sub?17:25,class:'nm'},g).textContent=name;
    if(sub)el('text',{x:NW/2,y:32,class:'sb'},g).textContent=sub;
    nodesEl[id]=g;
    g.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT);if(pinned)return;if(tip.hidden)show(id);else showT=setTimeout(()=>show(id),150)});
    g.addEventListener('mouseleave',()=>{clearTimeout(showT);if(!pinned)hideSoon()});
    g.addEventListener('focus',()=>{if(!pinned)show(id)});
    g.addEventListener('blur',()=>{if(!pinned)hide()});
    g.addEventListener('click',ev=>{ev.stopPropagation();if(pinned===id){pinned=null;hide()}else{pinned=id;show(id)}});
    g.addEventListener('keydown',ev=>{if(ev.key==='Escape'){pinned=null;hide()}});
  }
}

const nm=id=>(cur.label&&cur.label[id])||LIB[id].n;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(id){
  const L=LIB[id],has=id in cur.n,info=cur.n[id],sub=has&&Array.isArray(info)?info[0]:(info||''),note=has&&Array.isArray(info)?info[1]:'';
  svg.classList.add('focus');
  for(const k in nodesEl){nodesEl[k].classList.remove('on','sel')}
  nodesEl[id].classList.add('on','sel');
  const ins=[],outs=[];
  for(const x of edgesEl){
    x.e.classList.toggle('in',x.b===id);x.e.classList.toggle('out',x.a===id);
    if(x.b===id){nodesEl[x.a].classList.add('on');ins.push(`${nm(x.a)} (${x.lab})`)}
    if(x.a===id){nodesEl[x.b].classList.add('on');outs.push(`${nm(x.b)} (${x.lab})`)}
  }
  const isUnit=L.t==='unit';
  let here='';
  if(!has)here=`<div class="here">${esc(cur.name)} does not have this unit.</div>`;
  else if(sub||note){const cap=sub?(/^[\d× + + .]+$/.test(sub)?sub+' ×10⁴ t/yr':sub):'';here=`<div class="here"><b>${esc(cur.name)}: </b>${esc([cap,note].filter(Boolean).join('. '))}</div>`}
  const yl=has?yieldLine(cur,id):'';
  tip.innerHTML=`<h3>${esc(nm(id))}<span>${esc(__ZH[L.n]||L.e)}</span></h3>${here}${yl?`<div class="yl">${esc(yl)}</div>`:''}
    <p><b class="k">${isUnit?'What this step does':'What it is'}</b>${esc(L.d)}</p>
    <p><b class="k">${isUnit?'Where the products go':'Uses'}</b>${esc(L.u)}</p>
    ${ins.length||outs.length?`<div class="io">${ins.length?`<span class="i">← From: ${esc(ins.join(', '))}</span>`:''}${outs.length?`<span class="o">→ To: ${esc(outs.join(', '))}</span>`:''}</div>`:''}`;
  tip.hidden=false;
  const nr=nodesEl[id].getBoundingClientRect(),wr=wrap.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=nr.right-wr.left+12;if(left+tw>wr.width-4)left=nr.left-wr.left-tw-12;
  if(left<4)left=Math.max(4,Math.min(wr.width-tw-4,nr.left-wr.left));
  let top=nr.top-wr.top-10;
  if(left<nr.right-wr.left&&left+tw>nr.left-wr.left)top=nr.bottom-wr.top+10; // 放不到左右時改放下方
  top=Math.max(4,Math.min(top,Math.max(4,wr.height-th-4)));
  if(!(left<nr.right-wr.left&&left+tw>nr.left-wr.left))top=Math.max(4,Math.min(top,window.innerHeight-wr.top-th-8)); // 放在方塊旁邊時, 盡量留在視窗內
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hide(){tip.hidden=true;svg.classList.remove('focus');for(const k in nodesEl)nodesEl[k].classList.remove('on','sel');for(const x of edgesEl)x.e.classList.remove('in','out')}
document.addEventListener('click',()=>{if(pinned){pinned=null;hide()}});
/* 從方塊移到詳情框時保留詳情框, 離開詳情框後才隱藏 */
let hideT=null,showT=null;
function hideSoon(){clearTimeout(hideT);hideT=setTimeout(()=>{if(!pinned)hide()},200)}
tip.addEventListener('mouseenter',()=>{clearTimeout(hideT);clearTimeout(showT)});
tip.addEventListener('mouseleave',()=>{if(!pinned)hideSoon()});
tip.addEventListener('click',ev=>ev.stopPropagation());
document.getElementById('scroll').addEventListener('scroll',()=>{if(pinned)show(pinned)});

/* ---------- 選廠 ---------- */
const tabs=document.getElementById('tabs'),facts=document.getElementById('facts');
function select(id){
  const p=PLANTS.find(x=>x.id===id)||PLANTS[0];
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===p.id));
  facts.innerHTML=`<h2>${esc(p.name)}<span>${esc(p.full)}</span></h2>
    <dl class="kpis">${p.kpi.map(k=>`<div class="kpi"><dt>${esc(k[0])}</dt><dd>${esc(k[1])}<i>×10⁴ t/yr</i></dd></div>`).join('')}<div class="kpi"><dt>Refined-fuel yield</dt><dd>${esc(YIELD[p.id].oil.t)}</dd></div></dl>
    <dl class="meta">${p.meta.map(m=>`<dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd>`).join('')}<dt>Refined fuels</dt><dd>${esc(YIELD[p.id].oil.note)}</dd></dl>`;
  draw(p);
}
PLANTS.forEach(p=>{const b=document.createElement('button');b.type='button';b.id='tab-'+p.id;b.dataset.id=p.id;b.setAttribute('role','tab');
  b.innerHTML=`${esc(p.tab)}<small>${p.cap}</small>`;b.addEventListener('click',()=>{location.hash=p.id;select(p.id)});tabs.appendChild(b)});
window.addEventListener('hashchange',()=>select(location.hash.slice(1)));
select(location.hash.slice(1));

};
</script>
<script>
/* 語言切換：換掉 #app 的內容並重新執行該語言的腳本，先前登記在 document/window 上的監聽一併移除 */
(function(){
  var HL={"zh-TW": "zh-Hant-TW", "zh-CN": "zh-Hans-CN", "en": "en-US"}, TT={"zh-TW": "五大煉化流程圖", "zh-CN": "五大炼化流程图", "en": "Five Refiners Flowsheet"}, app=document.getElementById('app'), rec=[], cur=null;
  var btns=[].slice.call(document.querySelectorAll('.langsw button'));
  function mount(l){
    if(!window.__APP[l]) l='zh-TW';
    rec.forEach(function(r){r[0].removeEventListener(r[1],r[2],r[3])}); rec=[];
    var D=document, W=window, add=EventTarget.prototype.addEventListener;
    D.addEventListener=function(t,f,o){rec.push([D,t,f,o]);return add.call(D,t,f,o)};
    W.addEventListener=function(t,f,o){rec.push([W,t,f,o]);return add.call(W,t,f,o)};
    document.documentElement.lang=HL[l];
    try{ app.replaceChildren(document.getElementById('t-'+l).content.cloneNode(true)); window.__APP[l](); }
    finally{ delete D.addEventListener; delete W.addEventListener; }
    document.title=TT[l]; cur=l;
    btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-l')===l))});
    try{ localStorage.setItem('refinery-lang',l) }catch(e){}
  }
  btns.forEach(function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-l');if(l!==cur)mount(l)})});
  var init='zh-TW'; try{ init=localStorage.getItem('refinery-lang')||init }catch(e){}
  mount(init);
})();
</script>
