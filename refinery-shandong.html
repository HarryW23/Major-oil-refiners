<!doctype html>
<html lang="zh-Hant-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山東地煉流程圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* 直接打開文件時也要讓 hidden 生效（預覽外殼會自帶這條，獨立文件沒有） */
[hidden]{display:none!important}
/* 版面：主幹從左到右（原油→常壓→減壓→催化→焦化），各裝置的汽柴油往下落進兩條「池」；油品按顏色區分；圖下方是一噸原油去向和兩個池的組成 */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2421; --muted:#66706b; --line:#d9ddd6; --soft:#eceee9;
  --feed:#26302c; --feed-ink:#f6f7f4;
  --gas:#4f86d9; --light:#d99a12; --mid:#23917f; --jet:#2f78a8; --heavy:#94704f; --coke:#4c524f; --chem:#8a63c9;
  --gas-t:#e6eefb; --light-t:#fbf1dc; --mid-t:#ddf1ed; --jet-t:#e0edf6; --heavy-t:#f1e9e1; --coke-t:#e7e8e7; --chem-t:#efe8f8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2320; --ink:#e7ebe8; --muted:#9aa49f; --line:#2f3733; --soft:#252c28;
  --feed:#dfe5e1; --feed-ink:#141816;
  --gas:#79a7ee; --light:#efb43a; --mid:#4cc2ad; --jet:#5fa5d4; --heavy:#c09a76; --coke:#a3aaa6; --chem:#b291ea;
  --gas-t:#1d2a3d; --light-t:#352a12; --mid-t:#16302b; --jet-t:#18293a; --heavy-t:#33281e; --coke-t:#2a2e2c; --chem-t:#2a2238;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --ink:#e7ebe8; --muted:#9aa49f; --line:#2f3733; --soft:#252c28;
  --feed:#dfe5e1; --feed-ink:#141816;
  --gas:#79a7ee; --light:#efb43a; --mid:#4cc2ad; --jet:#5fa5d4; --heavy:#c09a76; --coke:#a3aaa6; --chem:#b291ea;
  --gas-t:#1d2a3d; --light-t:#352a12; --mid-t:#16302b; --jet-t:#18293a; --heavy-t:#33281e; --coke-t:#2a2e2c; --chem-t:#2a2238;
  color-scheme:dark }

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;
  padding-block:28px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:.03em}
.by{font-size:12px;font-weight:300;color:var(--muted);opacity:.75;margin-left:10px;letter-spacing:.03em;vertical-align:middle}
.lede{margin:4px 0 0;color:var(--muted);max-width:44em}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,25,.14)}
.seg button:focus-visible,.node:focus-visible{outline:2px solid var(--gas);outline-offset:2px}

.summary{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:820px){.summary{grid-template-columns:1fr}}
.summary p{margin:0;color:var(--ink);max-width:40em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b.light{color:var(--light)} .kpi b.mid{color:var(--mid)} .kpi b.coke{color:var(--coke)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px}

.board{position:relative;background:var(--surface);border-radius:16px;padding:8px 0}
.scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:1080px;height:auto;font-family:var(--font)}
.flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.flow.dash{stroke-dasharray:2 7;stroke-width:3}
.c-gas{stroke:var(--gas)} .c-light{stroke:var(--light)} .c-mid{stroke:var(--mid)} .c-jet{stroke:var(--jet)} .c-heavy{stroke:var(--heavy)} .c-coke{stroke:var(--coke)} .c-chem{stroke:var(--chem)}
.flab{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;transition:opacity .15s}
.node{cursor:pointer;transition:opacity .15s}
.node .card{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.unit .card{stroke:var(--ink);stroke-opacity:.55}
.node.feed .card{fill:var(--feed);stroke:var(--feed)}
.node.tag .card{fill:var(--bg);stroke:var(--heavy);stroke-dasharray:4 3}
.node .nm{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.node.feed .nm{fill:var(--feed-ink)}
.node.tag .nm{font-size:12px;font-weight:500;fill:var(--heavy)}
.node .ch{font-size:11px;font-family:var(--mono);text-anchor:middle;fill:var(--muted)}
.node.feed .ch{fill:var(--feed-ink);opacity:.75;font-size:10px}
.node.prod .ch{font-weight:500}
.pool .pn{font-size:13px;font-weight:700;fill:#fff;letter-spacing:.1em;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2px}
.pool .pv{font-size:11px;font-family:var(--mono);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2px}
svg.focus .node:not(.on){opacity:.22}
svg.focus .flow:not(.on){opacity:.1}
svg.focus .flab:not(.on){opacity:0}
.flow.on{stroke-width:4.5}

.tip{position:absolute;z-index:5;width:310px;max-width:calc(100% - 16px);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;pointer-events:auto;
  box-shadow:0 10px 30px rgba(20,30,25,.18);display:flex;flex-direction:column;gap:8px}
.tip h3{margin:0;font-size:15px}
.tip h3 span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
.tip .yl{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:6px;padding:5px 8px}
.tip p{margin:0}
.tip b.k{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:500}
.tip ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.tip li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.tip li span:last-child{font-family:var(--mono)}
.tip .io{font-size:12px;border-top:1px solid var(--line);padding-top:7px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;margin:0}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px}
.stack div{height:100%;min-width:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-family:var(--mono);white-space:nowrap;overflow:hidden}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block}
.keys b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.pools{display:flex;flex-direction:column;gap:14px}
.prow{display:flex;flex-direction:column;gap:6px}
.prow .t{font-size:13px;font-weight:500}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.foot{font-size:12px;color:var(--muted);max-width:75em;margin:0}
@media (prefers-reduced-motion:reduce){.flow,.node,.flab{transition:none}}

html[lang="zh-Hans-CN"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
html[lang="en-US"]{--font:"Inter","Noto Sans TC",system-ui,sans-serif}
.langrow{max-width:1320px;margin:0 auto 10px;display:flex;justify-content:flex-end}
.langsw{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.langsw button{font-family:var(--font);font-size:12px;border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.langsw button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
</style>

<template id="t-zh-TW">
<div class="page">
  <header>
    <div>
      <h1>山東地煉流程圖<span class="by">@Harry汪</span></h1>
      <p class="lede">一噸原油在山東地煉裡怎麼走：主線從常壓、減壓到催化、焦化，各裝置產出的汽油、柴油匯進兩個調和池。滑鼠停在方塊上看說明，可以移進說明框裡閱讀。</p>
    </div>
    <div class="seg" role="group" aria-label="選擇配置">
      <button type="button" id="m-fuel" data-m="fuel">傳統燃料型</button>
      <button type="button" id="m-up" data-m="up">轉型升級型</button>
    </div>
  </header>

  <section class="summary">
    <p id="mdesc"></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <div class="legend">
    <span><i style="background:var(--light)"></i>汽油系（石腦油、汽油）</span>
    <span><i style="background:var(--mid)"></i>柴油系</span>
    <span><i style="background:var(--heavy)"></i>重油（渣油、蠟油、油漿）</span>
    <span><i style="background:var(--gas)"></i>液化氣</span>
    <span><i style="background:var(--coke)"></i>石油焦</span>
    <span id="lg-up"><i style="background:var(--jet)"></i>航空煤油 <i style="background:var(--chem);margin-left:8px"></i>化工品</span>
    <span>方塊內：規模（萬噸/年）· 佔原油的典型比例</span>
  </div>

  <div class="board" id="board">
    <div class="scroll" id="scroll"><svg id="svg" viewBox="0 0 1250 600" role="img" aria-label="山東地煉工藝流程圖"></svg></div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="split">
    <section class="panel">
      <h2>一噸原油的去向<small>典型值示意，%</small></h2>
      <div class="stack" id="fate"></div>
      <div class="keys" id="fatekeys"></div>
    </section>
    <section class="panel">
      <h2>調和池組成<small>各裝置貢獻的比例，典型值示意</small></h2>
      <div class="pools" id="poolbars"></div>
    </section>
  </div>

  <section class="panel">
    <h2>山東地煉概況</h2>
    <ul>
      <li>2024年11月山東地煉產能約1.17億噸/年，佔全省煉能的66%；獨立煉廠從2015年的37家減到2024年的19家。</li>
      <li>2025年平均開工率約52%，明顯低於主營煉廠的72%左右，主要卡在原油進口配額和成品油利潤。</li>
      <li>原油配額不夠時，地煉用不佔配額的燃料油、稀釋瀝青、外購蠟油頂替，所以渣油比例高、焦化規模大、石油焦多。</li>
      <li>整合與淘汰：裕龍島計畫整合10家地煉、退出約2700萬噸產能；200萬噸/年以下的小煉廠按要求在2025年底前淘汰。省內目標是把地煉產能壓到9000萬噸左右，成品油收率降到40%左右。</li>
      <li>2026年原油非國營貿易進口配額總量持平，新增部分主要給了大型一體化計畫，中小地煉配額被削減；成品油出口配額沒有給山東地煉。</li>
    </ul>
  </section>

  <p class="foot">圖中百分比是典型地煉的經驗區間（佔原油加工量），不是某一家企業的實測或設計數值，各廠隨原油品質、重質原料摻煉比例、裝置配置和負荷差別很大。加工裝置標的是處理量佔原油的比例；「一噸原油的去向」和「調和池組成」按區間中值示意，合計為100%。產業數據取自金聯創、隆眾等機構的公開報導，口徑不完全一致。乾氣、氫氣、硫磺回收和公用工程未畫出。<br>By Harry汪</p>
</div>
</template>

<template id="t-en">
<div class="page">
  <header>
    <div>
      <h1>Shandong Teapot Refinery Flow<span class="by">@Harry汪</span></h1>
      <p class="lede">How a tonne of crude moves through a Shandong independent (“teapot”) refinery: the main line runs from atmospheric and vacuum distillation to the cat cracker and coker, and each unit’s gasoline and diesel flow into two blending pools. Hover over a box for details; you can move the pointer into the details box to read it.</p>
    </div>
    <div class="seg" role="group" aria-label="Choose configuration">
      <button type="button" id="m-fuel" data-m="fuel">Fuels-oriented</button>
      <button type="button" id="m-up" data-m="up">Upgraded</button>
    </div>
  </header>

  <section class="summary">
    <p id="mdesc"></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <div class="legend">
    <span><i style="background:var(--light)"></i>Gasoline range (naphtha, gasoline)</span>
    <span><i style="background:var(--mid)"></i>Diesel range</span>
    <span><i style="background:var(--heavy)"></i>Heavy oil (residue, gas oil, slurry)</span>
    <span><i style="background:var(--gas)"></i>LPG</span>
    <span><i style="background:var(--coke)"></i>Petcoke</span>
    <span id="lg-up"><i style="background:var(--jet)"></i>Jet fuel <i style="background:var(--chem);margin-left:8px"></i>Chemicals</span>
    <span>In boxes: capacity (10⁴ t/yr; 100 = 1 Mt/yr) · typical share of crude</span>
  </div>

  <div class="board" id="board">
    <div class="scroll" id="scroll"><svg id="svg" viewBox="0 0 1250 600" role="img" aria-label="Shandong teapot refinery process flow diagram"></svg></div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="split">
    <section class="panel">
      <h2>Where a tonne of crude goes<small>typical values, %</small></h2>
      <div class="stack" id="fate"></div>
      <div class="keys" id="fatekeys"></div>
    </section>
    <section class="panel">
      <h2>Blending pool make-up<small>share contributed by each unit, typical values</small></h2>
      <div class="pools" id="poolbars"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Shandong teapots at a glance</h2>
    <ul>
      <li>In November 2024 Shandong’s independent refiners had about 117 Mt/yr of capacity, 66% of the province’s total. Their number fell from 37 in 2015 to 19 in 2024.</li>
      <li>Average run rates in 2025 were about 52%, well below the roughly 72% at state-owned refineries, held back mainly by crude import quotas and fuel margins.</li>
      <li>When crude quotas run short, teapots substitute quota-free fuel oil, diluted bitumen and purchased gas oil. That is why their residue share is high, their cokers are large and they make a lot of petcoke.</li>
      <li>Consolidation and closures: the Yulong Island project absorbed 10 teapots and retired about 27 Mt/yr of capacity, and refineries under 2 Mt/yr were due to close by the end of 2025. The province aims to cut teapot capacity to about 90 Mt/yr and the refined-fuel yield to about 40%.</li>
      <li>Non-state crude import quotas for 2026 are flat in total; new allocations went mainly to large integrated projects, while small and mid-sized teapots saw cuts. No Shandong teapot received a fuel export quota.</li>
    </ul>
  </section>

  else{const y=o.y_&&o.y_[mode],s=o.s&&o.s[mode],parts=[];

function panels(){
  const M=MODES[mode];
  document.getElementById('mdesc').textContent=M.desc;
  document.getElementById('kpis').innerHTML=M.kpi.map(([t,v,c])=>`<div class="kpi"><span>${t}</span><b class="${c}">${v}</b></div>`).join('');
  const col=c=>c==='soft'?'var(--muted)':`var(--${c})`;
  document.getElementById('fate').innerHTML=M.fate.map(([n,v,c])=>`<div style="flex:${v};background:${col(c)}" title="${n} ${v}%">${v>=6?v+'%':''}</div>`).join('');
  document.getElementById('fatekeys').innerHTML=M.fate.map(([n,v,c])=>`<span><i style="background:${col(c)}"></i>${n} <b>${v}%</b></span>`).join('')+`<span>${esc(M.other)}</span>`;

      <div class="keys">${list.map(([n,v],i)=>`<span><i style="background:${sh[i]}"></i>${n} <b>${v}%</b></span>`).join('')}</div></div>`}).join('');
  document.getElementById('lg-up').hidden=mode!=='up';
}
function setMode(m){mode=MODES[m]?m:'fuel';pinned=null;

  draw();panels();}
for(const b of document.querySelectorAll('.seg button'))b.addEventListener('click',()=>{location.hash=b.dataset.m;setMode(b.dataset.m)});
window.addEventListener('hashchange',()=>setMode(location.hash.slice(1)));
setMode(location.hash.slice(1));

};

const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg'),tip=document.getElementById('tip'),board=document.getElementById('board');

function path(pts){

}

(function(){
  var HL={"zh-TW": "zh-Hant-TW", "zh-CN": "zh-Hans-CN", "en": "en-US"}, TT={"zh-TW": "山東地煉流程圖", "zh-CN": "山东地炼流程图", "en": "Shandong Teapot Refinery Flow"}, app=document.getElementById('app'), rec=[], cur=null;

    var D=document, W=window, add=EventTarget.prototype.addEventListener;
    D.addEventListener=function(t,f,o){rec.push([D,t,f,o]);return add.call(D,t,f,o)};
    W.addEventListener=function(t,f,o){rec.push([W,t,f,o]);return add.call(W,t,f,o)};

    finally{ delete D.addEventListener; delete W.addEventListener; }
    document.title=TT[l]; cur=l;
